[project]
name = "credit-scoring"
version = "0.1.0"
description = "Credit Scoring Service deciding to give certain client a credit card or not"
readme = "README.md"
authors = [
    { name = "Nikita Shyshkin", email = "yatoenough@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.159.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
serve = "credit_scoring:serve"
train = "train:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
